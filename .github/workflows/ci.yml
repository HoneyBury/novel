name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  cross-platform-check:
    name: Cross Platform Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate context pack via Python
        run: python 08_tools/build_context_pack.py --chapter 1 --character-names 谢衡 苏明玥

      - name: Generate context pack via PowerShell
        shell: pwsh
        run: ./08_tools/build_context_pack.ps1 -Chapter 2 -CharacterNames 谢衡,苏明玥

      - name: Validate workspace artifacts
        run: python 08_tools/validate_workspace.py
