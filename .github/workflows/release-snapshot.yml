name: Release Snapshot

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-snapshot:
    name: Publish Snapshot (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match required format v.x.x"
            exit 1
          fi

      - name: Build zip snapshot
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="novel-snapshot-${TAG}.zip"
          git archive --format=zip --output "$ARCHIVE" --prefix "novel-${TAG}/" HEAD
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.ref_name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Novel Snapshot ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
